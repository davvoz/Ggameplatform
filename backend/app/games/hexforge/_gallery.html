});
ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#c8b89a';
heroes.forEach((h, i) => ctx.fillText(h.fusion.map((p) => p.form).join(' + ') + ' ◆' + h.grade, 120 + i * 190, 892));
document.title = 'drawn';
</script></body></html>
