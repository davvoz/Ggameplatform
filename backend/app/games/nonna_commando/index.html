<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a0f1e">
    <title>Nonna Commando</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="loading">
    <main id="stage">
        <div id="frame">
            <canvas id="game-canvas" width="384" height="216" aria-label="Nonna Commando"></canvas>
            <div class="chrome">
                <button id="btn-pause" class="pix-btn" aria-label="Pause">
                    <svg viewBox="0 0 8 8" aria-hidden="true"><rect x="1" y="1" width="2" height="6"/><rect x="5" y="1" width="2" height="6"/></svg>
                </button>
                <button id="btn-sound" class="pix-btn" aria-label="Sound off" aria-pressed="false">
                    <svg viewBox="0 0 8 8" aria-hidden="true">
                        <path class="on" d="M0 3h2l2-2v6L2 5H0zM5 2h1v1H5zM6 3h1v2H6zM5 5h1v1H5z"/>
                        <path class="off" d="M0 3h2l2-2v6L2 5H0zM5 2l3 3-1 1-3-3zM7 2l1 1-3 3-1-1z"/>
                    </svg>
                </button>
                <button id="btn-fullscreen" class="pix-btn" aria-label="Full screen">
                    <svg viewBox="0 0 8 8" aria-hidden="true"><path d="M0 0h3v1H1v2H0zM5 0h3v3H7V1H5zM0 5h1v2h2v1H0zM7 5h1v3H5V7h2z"/></svg>
                </button>
            </div>
            <div id="rewards" class="rewards" aria-live="polite"></div>
        </div>

        <div id="touch" aria-hidden="true">
            <div class="stick-zone"></div>
            <div class="stick"><div class="knob"></div></div>
            <button class="pad pad-fire" data-btn="FIRE">FIRE</button>
            <button class="pad pad-jump" data-btn="JUMP">JUMP</button>
            <button class="pad pad-bomb" data-btn="BOMB">BOMB</button>
        </div>

        <div id="loading" class="loading">
            <div class="meatballs" aria-hidden="true"><i></i><i></i><i></i></div>
            <p>NONNA IS LOADING THE GUNS</p>
        </div>

        <div class="rotate-guard" aria-hidden="true">
            <svg viewBox="0 0 120 120">
                <rect class="phone" x="42" y="22" width="36" height="66" rx="6"/>
                <path class="turn" d="M28 96a44 44 0 0 0 64 0M88 86l4 10-10 3"/>
            </svg>
            <p>TURN YOUR PHONE</p>
        </div>
    </main>

    <script src="../../sdk/platformsdk.obf.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
